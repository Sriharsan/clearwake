name: Clearwake offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s vendor/relayloom/tests -v
        env:
          PYTHONPATH: vendor/relayloom
      - run: node --check web/payment.js
      - run: node --test tests/payment.test.cjs
      - run: node --test vendor/relayloom/tests/ui.test.cjs
      # No provider secret, account action, paid resource or inference is used.
